app-id: io.github.twodust.v2rayN
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: v2rayN
build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  env:
    DOTNET_ROOT: /usr/lib/sdk/dotnet10
    DOTNET_CLI_HOME: /run/build/v2rayn
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_NOLOGO: "1"
    NUGET_AUDIT: "false"
finish-args:
  - --share=network
  - --socket=session-bus
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --env=V2RAYN_LOCAL_APPLICATION_DATA_V2=1

modules:
  - name: v2rayn
    buildsystem: simple
    build-commands:
      - cd v2rayN
      - dotnet --info
      - dotnet restore v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -r linux-x64 --disable-parallel --ignore-failed-sources --source /run/build/v2rayn/nuget-sources --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
      - dotnet publish v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=false --no-restore -o /app/lib/v2rayN
      - install -Dm755 /run/build/v2rayn/flatpak/v2rayn-launcher.sh /app/bin/v2rayN
      - install -Dm644 /run/build/v2rayn/v2rayN/v2rayN.Desktop/v2rayN.png /app/share/icons/hicolor/256x256/apps/io.github.twodust.v2rayN.png
      - install -Dm644 /run/build/v2rayn/flatpak/io.github.twodust.v2rayN.desktop /app/share/applications/io.github.twodust.v2rayN.desktop
      - install -Dm644 /run/build/v2rayn/flatpak/io.github.twodust.v2rayN.metainfo.xml /app/share/metainfo/io.github.twodust.v2rayN.metainfo.xml
    sources:
      - type: dir
        path: ..
      - nuget-sources.json
